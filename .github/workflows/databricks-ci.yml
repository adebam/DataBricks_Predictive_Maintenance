name: Predictive Maintenance - Databricks CI

on:
  push:
    branches:
      - main
      - feature/databricks-bundles
    paths:
      - 'databricks.yml'
      - 'resources/**'
      - 'Predictive_Maintenance/notebooks/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/databricks-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'databricks.yml'
      - 'resources/**'
      - 'Predictive_Maintenance/notebooks/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/databricks-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest and DEV Bundle Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run pytest
        run: |
          python -m pytest tests/ -v

      # Skip Databricks authentication for pull requests
      # originating from external forks, where secrets
      # are not available.
      - name: Install Databricks CLI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: databricks/setup-cli@main
        with:
          version: '1.23.0'

      - name: Verify Databricks authentication
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks auth describe
          databricks workspace list / --output json > /dev/null
          databricks jobs list --output json > /dev/null

      - name: Validate Databricks DEV Asset Bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle validate -t dev

      - name: Verify existing DEV bundle deployment state
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle summary --force-pull -t dev
