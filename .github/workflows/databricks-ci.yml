
name: Databricks CI

on:
  push:
    branches:
      - main
      - feature/databricks-bundles
    paths:
      - 'databricks.yml'
      - 'resources/**'
      - 'Predictive_Maintenance/notebooks/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/databricks-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'databricks.yml'
      - 'resources/**'
      - 'Predictive_Maintenance/notebooks/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/databricks-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Databricks notebooks and bundle references
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run pytest
        run: |
          python -m pytest tests/ -v
