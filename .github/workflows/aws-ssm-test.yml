
name: AWS SSM Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    name: Test EC2 connection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      INSTANCE_ID: i-0b6ed98d8f6acb7ce

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::409400548716:role/GitHubActions-PMDash-Deploy
          aws-region: us-east-1
          allowed-account-ids: '409400548716'

      - name: Execute read-only EC2 command
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub SSM connection test" \
            --parameters '{"commands":["whoami","sudo -u ubuntu git -C /home/ubuntu/DataBricks_Predictive_Maintenance status --short --branch"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
